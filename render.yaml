# Render blueprint for the backend API (https://render.com/docs/blueprint-spec).
# The frontend deploys to Vercel with "frontend" as the root directory.
services:
  - type: web
    name: submitdesk-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: TypeScript and the Prisma CLI are devDependencies.
    # Migrations run on every deploy, then the client is generated and the app compiled.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_SECRET
        sync: false # same value as the frontend's JWT_SECRET
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://submitdesk.vercel.app
      - key: SEED_MENTOR_EMAIL
        sync: false
      - key: SEED_MENTOR_PASSWORD
        sync: false
